<div id="globe-container" style="width: 100%; height: 220px; margin: auto;"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("globe-container");
    // Se o container ainda não tiver tamanho, forçamos um padrão para garantir o render
    const width = container.clientWidth || 200; 
    const height = container.clientHeight || 200;
    const sensitivity = 75;

    const svg = d3.select("#globe-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

    // Projeção Ortográfica
    const projection = d3.geoOrthographic()
        .scale(width / 2.2) 
        .center([0, 0])
        .rotate([0, -30])
        .translate([width / 2, height / 2]);

    const initialScale = projection.scale();
    const path = d3.geoPath().projection(projection);

    // Oceano
    svg.append("circle")
        .attr("fill", "#ADD8E6")
        .attr("stroke", "#000")
        .attr("stroke-width", "0.5")
        .attr("cx", width / 2)
        .attr("cy", height / 2)
        .attr("r", initialScale);

    const mapGroup = svg.append("g");
    const linesGroup = svg.append("g");

    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
        .then(world => {
            const countries = topojson.feature(world, world.objects.countries).features;

            // Países
            mapGroup.selectAll(".country")
                .data(countries)
                .enter().append("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", "#FFFFFF")
                .attr("stroke", "#000000")
                .attr("stroke-width", 0.5)
                .style("cursor", "pointer")
                .on("mouseover", function() { d3.select(this).attr("fill", "#e6f3ff"); })
                .on("mouseout", function() { d3.select(this).attr("fill", "#FFFFFF"); });

            // Rede (nós e links)
            const nodes = d3.range(15).map(() => [Math.random() * 360 - 180, Math.random() * 180 - 90]);
            const links = [];
            for(let i=0; i<nodes.length; i++) {
                for(let j=i+1; j<nodes.length; j++) {
                    if(Math.random() > 0.85) links.push({type: "LineString", coordinates: [nodes[i], nodes[j]]});
                }
            }

            function drawLinks() {
                const linkPath = linesGroup.selectAll(".network-link").data(links);
                linkPath.enter().append("path")
                    .attr("class", "network-link")
                    .merge(linkPath)
                    .attr("d", path)
                    .attr("fill", "none")
                    .attr("stroke", "rgba(0, 0, 0, 0.4)")
                    .attr("stroke-width", 0.8)
                    .attr("stroke-dasharray", "2,2");
                linkPath.exit().remove();
            }

            // Animação
            d3.timer(function() {
                const rotate = projection.rotate();
                const k = sensitivity / projection.scale();
                projection.rotate([rotate[0] - 1 * k, rotate[1]]);
                path.projection(projection);
                mapGroup.selectAll("path").attr("d", path);
                drawLinks();
            });
            
            // Drag
            svg.call(d3.drag().on('drag', (event) => {
                const rotate = projection.rotate();
                const k = sensitivity / projection.scale();
                projection.rotate([rotate[0] + event.dx * k, rotate[1] - event.dy * k]);
                path.projection(projection);
                mapGroup.selectAll("path").attr("d", path);
                drawLinks();
            }));
        })
        .catch(err => console.error("Erro ao carregar o mapa: ", err));
});
</script>
